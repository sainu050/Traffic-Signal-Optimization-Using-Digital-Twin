<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="iconCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="iconGreenCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="128" height="128" rx="28" fill="#0b0f19" stroke="#1e293b" stroke-width="2.5" />

  <!-- Flow Streams forming 'U' + intersection loop -->
  <g transform="translate(16, 16)">
    <!-- Primary Loop -->
    <path d="M 28 20 C 28 54, 46 72, 70 72 C 78 72, 84 68, 84 58 C 84 46, 66 38, 50 38 C 36 38, 28 46, 28 58 C 28 76, 46 84, 70 84"
          fill="none" 
          stroke="url(#iconCyanBlue)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          filter="url(#iconGlow)" />

    <!-- Converging Flow Branch -->
    <path d="M 50 16 C 50 36, 66 48, 84 48" 
          fill="none" 
          stroke="url(#iconGreenCyan)" 
          stroke-width="6.5" 
          stroke-linecap="round" />

    <!-- Signal Sensor Nodes -->
    <circle cx="28" cy="20" r="5" fill="#10b981" filter="url(#iconGlow)" />
    <circle cx="50" cy="16" r="4.5" fill="#06b6d4" filter="url(#iconGlow)" />
    <circle cx="70" cy="84" r="5" fill="#3b82f6" filter="url(#iconGlow)" />
    <circle cx="84" cy="48" r="4" fill="#f59e0b" filter="url(#iconGlow)" />
  </g>
</svg>
